services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: srm_user
      POSTGRES_PASSWORD: srm_password
      POSTGRES_DB: srm_db
    ports:
      - "5432:5432"
    volumes:
      - srm_pgdata:/var/lib/postgresql/data
      - ./server/src/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./server/src/db/seeds/001_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm_user -d srm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      CLIENT_URL: http://localhost:8080
      DATABASE_URL: postgres://srm_user:srm_password@db:5432/srm_db
      JWT_SECRET: docker-local-development-secret-change-if-needed
      JWT_EXPIRES_IN: 8h
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  srm_pgdata:
