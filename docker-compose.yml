services:
  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
      NODE_ENV: production
      CLIENT_URL: http://localhost:8080
    ports:
      - "4000:4000"

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
